<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("ptcg-theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.dataset.theme=t;var pl=localStorage.getItem("ptcg-palette");if(pl==="green")d.dataset.palette="green";}catch(e){}try{if(sessionStorage.getItem("ptcg-ball")){sessionStorage.removeItem("ptcg-ball");if(!matchMedia("(prefers-reduced-motion: reduce)").matches)d.classList.add("ball-arrive");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio · Poké TCG Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9e1fe" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17121f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poké TCG">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/portfolio.css">
</head>
<body>
<main class="wrap">
<div id="err"></div>
<h1>Portfolio</h1>
<p class="sub">What your collection is worth, how it moved, and your most valuable cards.</p>
<section class="hero" id="hero" aria-label="Total holdings"></section>
<div id="chart"></div>
<div class="stats" id="stats"></div>
<section class="movers" id="movers" aria-label="Biggest price movers" hidden></section>
<div class="sec-h">Your cards</div>
<div class="bar" id="bar">
  <label class="fld">Sort
    <select id="fSort">
      <option value="price">Price (high → low)</option>
      <option value="priceAsc">Price (low → high)</option>
      <option value="set">Set</option>
      <option value="lang">Language</option>
    </select></label>
  <label class="fld">Set <select id="fSet"></select></label>
  <label class="fld">Language
    <select id="fLang"><option value="all">All</option><option value="EN">EN</option><option value="JP">JP</option></select></label>
</div>
<p class="count" id="count"></p>
<div class="grid" id="out"></div>
<p class="foot">Prices are manual estimates from TCGplayer and PriceCharting — not an appraisal. Card photos are the owner's own.</p>
</main>
<script type="module" src="js/portfolio.js"></script>
</body></html>
